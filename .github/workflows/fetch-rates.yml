name: Fetch CBC Exchange Rates

on:
  schedule:
    - cron: '0 9 * * 1-5'  # 9:00 UTC = 17:00 UTC+8, weekdays only
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rates from CBC
        run: |
          curl -fsSL "https://cpx.cbc.gov.tw/API/DataAPI/Get?FileName=BP01D01" \
            -o evaperdiem/rates.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evaperdiem/rates.json
          git diff --cached --quiet || git commit -m "chore: update CBC exchange rates"
          git push
